function splitLogical(line) {

    else if (c === "|" && line[i + 1] === "|") { parts.push({ expr: buf, op: "||" }); buf = ""; i += 2; }

      const t = THEORY[k];
      if (!t) return ok("No hay entrada de manual para '" + k + "'.\n");
      return ok(k.toUpperCase() + "(1)\n\n  " + t.what + "\n\n  Sintaxis: " + t.syntax + "\n");
    }

    case "history":
      return ok((term.history || []).map((h, i) => String(i + 1).padStart(2, " ") + "  " + h).join("\n") + "\n");

    case "chmod": {
      const mode = args[0], file = args[1];
      if (!mode || !file) return err("chmod: se necesita modo y archivo");
      const node = getNode(term.fs, resolve(term, file));
      if (!node) return err("chmod: " + file + ": No such file or directory");
      if (/^[0-7]{3}$/.test(mode)) node.perm = mode;
      else if (mode.startsWith("+")) node.perm = mode.includes("x") ? "755" : mode.includes("w") ? "666" : "644";
      else if (mode.startsWith("-")) node.perm = node.type === "dir" ? "700" : "600";
      else return err("chmod: modo inválido: " + mode);
      return ok("");
    }

    case "export": {
      term.env = term.env || {};
      const assign = args.find(a => a.includes("="));
      if (!assign) return ok(Object.entries(term.env).map(([k, v]) => k + "=" + v).join("\n") + "\n");
      const idx = assign.indexOf("=");
      const name = assign.slice(0, idx);
      if (!name) return err("export: nombre de variable inválido");
      term.env[name] = assign.slice(idx + 1);
      return ok("");
    }

    case "env":
    case "printenv": {
      const rows = Object.assign({}, term.env || {}, { PWD: pathStr(term.cwd) });
      return ok(Object.entries(rows).map(([k, v]) => k + "=" + v).join("\n") + "\n");
    }

    case "clear":
      return { out: "", clear: true };

    case "help":
      return ok("Comandos: pwd, ls, cd, mkdir, touch, cat, echo, cp, mv, rm, head, tail, wc, grep, find, man, history, chmod, export, env, clear.\n");

    default:
      return err(cmd + ": command not found");
  }
}

/* ---------- 5. ESTADO + PERSISTENCIA ---------- */
const STORE_KEY = "cli_duo_state_v1";
function defaultProgress() { return { xp: 0, completed: [], streak: 0, lastDate: null }; }
function loadProgress() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(defaultProgress(), JSON.parse(raw)) : defaultProgress(); }
  catch (e) { return defaultProgress(); }
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); } catch (e) {}
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function touchStreak() {
  const p = state.progress, t = todayStr();
  if (p.lastDate === t) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  p.streak = p.lastDate === y ? p.streak + 1 : 1;
  p.lastDate = t;
  saveProgress();
}

let state = {
  screen: "home",
  progress: loadProgress(),
  lesson: null, cardIndex: 0,
  steps: [], stepIndex: 0, hearts: 3, earned: 0,
  term: null, awaiting: false, wrongTries: 0,
  feedback: null
};

/* ---------- 6. VISTAS ---------- */
const app = document.getElementById("app");

function header() {
  const p = state.progress;
  return `
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="goHome()" class="flex items-center gap-2 font-black text-xl text-duo-green">
        <span class="text-2xl">🐧</span> CLI&nbsp;Terminal
      </button>
      <div class="flex items-center gap-3 text-sm font-bold">
        <span class="flex items-center gap-1 text-duo-yellow">🔥 ${p.streak}</span>
        <span class="flex items-center gap-1 text-duo-blue">⭐ ${p.xp} XP</span>
      </div>
    </div>
  </header>`;
}

function renderHome() {
  const p = state.progress;
  const nodes = LESSONS.map((l, i) => {
    const unlocked = i === 0 || p.completed.includes(LESSONS[i - 1].id);
    const done = p.completed.includes(l.id);
    const offset = i % 2 === 0 ? "translate-x-8" : "-translate-x-8";
    return `
    <div class="flex flex-col items-center ${offset}">
      <button ${unlocked ? `onclick="startLesson(${l.id})"` : "disabled"}
        class="relative w-20 h-20 rounded-full flex items-center justify-center text-3xl font-black btn-3d
          ${done ? "bg-duo-green text-white shadow-[0_5px_0_#46a302]" :
                    unlocked ? "bg-duo-green text-white shadow-[0_5px_0_#46a302] pulse-ring" :
                               "bg-slate-200 text-slate-400 shadow-[0_5px_0_#cbd5e1] cursor-not-allowed"}">
        ${done ? "✓" : unlocked ? l.icon : "🔒"}
      </button>
      <span class="mt-2 text-xs font-bold ${unlocked ? "text-slate-700" : "text-slate-400"}">${l.title}</span>
    </div>
    ${i < LESSONS.length - 1 ? `<div class="w-2 h-8 ${p.completed.includes(l.id) ? "bg-duo-green" : "bg-slate-200"} rounded-full"></div>` : ""}`;
  }).join("");

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-8 fade-in">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-slate-800">Aprende la terminal desde cero</h1>
      <p class="text-slate-500 font-semibold mt-1">Teoría clara + práctica real con una terminal de verdad.</p>
    </div>
    <div class="bg-white rounded-3xl border-2 border-slate-200 p-8 flex flex-col items-center gap-2">
      ${nodes}
    </div>
    <div class="mt-6 flex flex-col items-center gap-3">
      <button onclick="startSandbox()" class="bg-duo-blue text-white font-black px-6 py-3 rounded-2xl shadow-[0_5px_0_#1899d6] btn-3d">⌨️ Terminal libre (sandbox)</button>
      <button onclick="resetAll()" class="text-xs font-bold text-slate-400 hover:text-duo-red underline">Reiniciar todo el progreso</button>
    </div>
  </main>`;
}

function renderTheory() {
  const lesson = state.lesson;
  const cmdKey = lesson.theory[state.cardIndex];
  const t = THEORY[cmdKey];
  const total = lesson.theory.length;
  const isLast = state.cardIndex === total - 1;

  const examples = t.examples.map(e => `
    <div class="term bg-slate-900 text-slate-100 rounded-xl overflow-hidden text-sm">
      <div class="flex"><span class="text-duo-green px-3 py-1">$</span><span class="py-1">${esc(e.cmd)}</span></div>
      ${e.out ? `<div class="text-slate-300 px-3 pb-2">${esc(e.out)}</div>` : ""}
    </div>`).join("");

  const section = (icon, title, body) => `
    <div class="border-l-4 border-duo-green pl-4">
      <h3 class="font-black text-slate-800 flex items-center gap-2">${icon} ${title}</h3>
      <p class="text-slate-600 font-medium mt-1">${body}</p>
    </div>`;

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="mb-4">
      <div class="flex items-center justify-between text-sm font-bold text-slate-400">
        <span>Fase de teoría</span><span>${state.cardIndex + 1} / ${total}</span>
      </div>
      <div class="h-3 bg-slate-200 rounded-full mt-2 overflow-hidden">
        <div class="h-full bg-duo-green transition-all" style="width:${((state.cardIndex + 1) / total) * 100}%"></div>
      </div>
    </div>

    <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 md:p-8">
      <div class="flex items-center gap-3 mb-6">
        <span class="term bg-slate-900 text-duo-green font-bold px-3 py-1 rounded-lg">${t.name}</span>
        <span class="text-slate-500 font-bold">${t.tagline}</span>
      </div>
      <div class="space-y-5">
        ${section("🔎", "¿Qué es y qué hace?", t.what)}
        ${section("⚙️", "¿Cómo funciona internamente?", t.how)}
        ${section("💼", "¿Para qué sirve en la vida real?", t.real)}
        <div class="border-l-4 border-duo-blue pl-4">
          <h3 class="font-black text-slate-800">⌨️ ¿Cómo se usa?</h3>
          <p class="text-slate-600 font-medium mt-1">Sintaxis: <code class="term bg-slate-100 px-2 py-0.5 rounded">${esc(t.syntax)}</code></p>
          <div class="mt-3 space-y-2">${examples}</div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mt-6">
      <button onclick="prevCard()" class="font-black text-slate-400 px-4 py-3 rounded-2xl hover:bg-slate-200" ${state.cardIndex === 0 ? "disabled" : ""}>Atrás</button>
      <button onclick="nextCard()" class="bg-duo-green text-white font-black px-8 py-3 rounded-2xl shadow-[0_5px_0_#46a302] btn-3d hover:brightness-105">
        ${isLast ? "¡Ir a la práctica!" : "Siguiente"}
      </button>
    </div>
  </main>`;
}

function heartRow() {
  let h = "";
  for (let i = 0; i < 3; i++) h += i < state.hearts ? "❤️" : "🤍";
  return h;
}

function renderPractice() {
  const step = state.steps[state.stepIndex];
  const pct = (state.stepIndex / state.steps.length) * 100;

  let body = "";
  if (step.type === "mc") {
    body = `
      <h2 class="text-2xl font-black text-slate-800 mb-6">${esc(step.q)}</h2>
      <div class="grid gap-3">
        ${step.options.map((o, i) => {
          let cls = "border-slate-200 hover:bg-slate-50";
          if (state.feedback) {
            if (i === step.answer) cls = "border-duo-green bg-green-50";
            else if (i === state.feedback.picked) cls = "border-duo-red bg-red-50";
          }
          return `<button ${state.feedback ? "disabled" : ""} onclick="answerMC(${i})"
            class="text-left font-bold border-2 rounded-2xl px-5 py-4 ${cls} transition">${esc(o)}</button>`;
        }).join("")}
      </div>`;
  } else {
    const lines = (state.term ? state.term.lines : []).map(l =>
      l.type === "cmd"
        ? `<div class="text-slate-100"><span class="text-duo-green">estudiante@cli</span><span class="text-duo-blue">:${pathStr(state.term.cwd)}$</span> ${esc(l.text)}</div>`
        : `<div class="${l.error ? "text-duo-red" : "text-slate-300"}">${esc(l.text)}</div>`
    ).join("");
    body = `
      <h2 class="text-2xl font-black text-slate-800 mb-2">⌨️ ${esc(step.prompt)}</h2>
      <p class="text-slate-500 font-semibold mb-4">Escribe el comando y pulsa Enter.</p>
      <div class="term bg-slate-900 rounded-2xl p-4 h-64 overflow-y-auto text-sm" id="termBody">
        ${lines}
        <div class="text-slate-100 flex items-center gap-1">
          <span class="text-duo-green">estudiante@cli</span><span class="text-duo-blue">:${pathStr(state.term.cwd)}$</span>
          <input id="termInput" autocomplete="off" spellcheck="false"
            class="flex-1 bg-transparent outline-none text-slate-100 caret-duo-green" />
        </div>
      </div>
      ${state.wrongTries >= 2 ? `<p class="mt-3 text-sm font-bold text-duo-yellow">💡 Pista: ${esc(step.hint)}</p>` : ""}
      <div id="termMsg" class="mt-2 text-sm font-bold h-5"></div>`;
  }

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="flex items-center gap-4 mb-6">
      <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full bg-duo-green transition-all" style="width:${pct}%"></div>
      </div>
      <span class="font-black text-lg whitespace-nowrap">${heartRow()}</span>
    </div>
    <div class="bg-white rounded-3xl border-2 border-slate-200 p-6 md:p-8">${body}</div>
  </main>`;

  if (step.type === "term" && !state.feedback) {
    attachTermInput(state.term, v => submitTerm(v));
  }
}

function attachTermInput(term, onRun) {
  const input = document.getElementById("termInput");
  if (!input) return;
  const body = document.getElementById("termBody");
  if (body) body.scrollTop = body.scrollHeight;
  input.focus();
  term.histPos = (term.history || []).length;
  input.addEventListener("keydown", e => {
    const h = term.history || [];
    if (e.key === "Enter") {
      onRun(input.value);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (term.histPos > 0) { term.histPos--; input.value = h[term.histPos] || ""; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (term.histPos < h.length - 1) { term.histPos++; input.value = h[term.histPos] || ""; }
      else { term.histPos = h.length; input.value = ""; }
    }
  });
}

function renderResult(success) {
  const lesson = state.lesson;
  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-12 text-center fade-in">
    <div class="text-6xl mb-4">${success ? "🎉" : "💔"}</div>
    <h1 class="text-3xl font-black ${success ? "text-duo-green" : "text-duo-red"}">
      ${success ? "¡Lección completada!" : "Te quedaste sin vidas"}
    </h1>
    <p class="text-slate-500 font-semibold mt-2">
      ${success ? "Conectaste la teoría con la práctica real." : "Repasa la teoría y vuelve a intentarlo."}
    </p>
    ${success ? `<div class="flex justify-center gap-6 mt-6">
      <div class="bg-white border-2 border-slate-200 rounded-2xl px-6 py-4"><div class="text-2xl font-black text-duo-blue">+${state.earned}</div><div class="text-xs font-bold text-slate-400">XP</div></div>
      <div class="bg-white border-2 border-slate-200 rounded-2xl px-6 py-4"><div class="text-2xl font-black text-duo-yellow">${state.progress.streak}</div><div class="text-xs font-bold text-slate-400">RACHA 🔥</div></div>
    </div>` : ""}
    <div class="mt-10 flex justify-center gap-3">
      <button onclick="goHome()" class="font-black text-slate-500 px-6 py-3 rounded-2xl hover:bg-slate-200">Inicio</button>
      <button onclick="startLesson(${lesson.id})" class="bg-duo-green text-white font-black px-8 py-3 rounded-2xl shadow-[0_5px_0_#46a302] btn-3d">
        ${success ? "Repetir" : "Intentar de nuevo"}
      </button>
    </div>
  </main>`;
}

function startSandbox() {
  state.screen = "sandbox";
  state.term = newTerm();
  renderSandbox();
}

function resetSandbox() { state.term = newTerm(); renderSandbox(); }

function runSandbox(value) {
  const term = state.term;
  term.lines.push({ type: "cmd", text: value });
  const result = runLine(term, value);
  if (result.clear) term.lines = [];
  else if (result.out) term.lines.push({ type: "out", text: result.out.trimEnd(), error: result.error });
  renderSandbox();
}

function renderSandbox() {
  const term = state.term;
  const lines = term.lines.map(l =>
    l.type === "cmd"
      ? `<div class="text-slate-100"><span class="text-duo-green">estudiante@cli</span><span class="text-duo-blue">:${pathStr(term.cwd)}$</span> ${esc(l.text)}</div>`
      : `<div class="${l.error ? "text-duo-red" : "text-slate-300"}">${esc(l.text)}</div>`
  ).join("");

  app.innerHTML = `${header()}
  <main class="max-w-3xl mx-auto px-4 py-6 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-black text-slate-800">⌨️ Terminal libre</h1>
      <div class="flex gap-2">
        <button onclick="resetSandbox()" class="text-sm font-bold text-slate-500 px-3 py-2 rounded-xl hover:bg-slate-200">Reiniciar</button>
        <button onclick="goHome()" class="text-sm font-bold text-slate-500 px-3 py-2 rounded-xl hover:bg-slate-200">Inicio</button>
      </div>
    </div>
    <p class="text-slate-500 font-semibold mb-3">Practica sin límites: cualquier comando, sin retos ni vidas. Usa ↑ y ↓ para el historial.</p>
    <div class="term bg-slate-900 rounded-2xl p-4 h-[28rem] overflow-y-auto text-sm" id="termBody">
      ${lines}
      <div class="text-slate-100 flex items-center gap-1">
        <span class="text-duo-green">estudiante@cli</span><span class="text-duo-blue">:${pathStr(term.cwd)}$</span>
        <input id="termInput" autocomplete="off" spellcheck="false"
          class="flex-1 bg-transparent outline-none text-slate-100 caret-duo-green" />
      </div>
    </div>
  </main>`;
  attachTermInput(term, v => runSandbox(v));
}

/* ---------- 7. LÓGICA DE JUEGO ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function goHome() { state.screen = "home"; renderHome(); }

function startLesson(id) {
  state.lesson = LESSONS.find(l => l.id === id);
  state.cardIndex = 0;
  state.steps = state.lesson.steps;
  state.stepIndex = 0;
  state.hearts = 3;
  state.earned = 0;
  state.feedback = null;
  state.wrongTries = 0;
  state.term = newTerm();
  state.screen = "theory";
  renderTheory();
}

function prevCard() { if (state.cardIndex > 0) { state.cardIndex--; renderTheory(); } }
function nextCard() {
  if (state.cardIndex < state.lesson.theory.length - 1) { state.cardIndex++; renderTheory(); }
  else { state.screen = "practice"; state.term = newTerm(); state.stepIndex = 0; state.wrongTries = 0; renderPractice(); }
}

function answerMC(i) {
  if (state.feedback) return;
  const step = state.steps[state.stepIndex];
  state.feedback = { picked: i };
  if (i === step.answer) { state.earned += 10; }
  else { state.hearts--; }
  renderPractice();
  setTimeout(() => {
    if (state.hearts <= 0) { state.feedback = null; renderResult(false); return; }
    state.feedback = null;
    state.stepIndex++;
    state.wrongTries = 0;
    if (state.stepIndex >= state.steps.length) finishLesson();
    else renderPractice();
  }, i === step.answer ? 850 : 1650);
}

function submitTerm(value) {
  if (state.feedback) return;
  const step = state.steps[state.stepIndex];
  const term = state.term;
  term.lines.push({ type: "cmd", text: value });
  const result = runLine(term, value);
  if (result.clear) term.lines = [];
  else if (result.out) term.lines.push({ type: "out", text: result.out.trimEnd(), error: result.error });

  const firstStages = splitPipeline(splitLogical(value)[0].expr);
  const first = firstStages.length ? parseStage(firstStages[0]) : { cmd: "", args: [] };
  const ctx = { cmd: first.cmd, args: first.args || [], out: result.out || "", term, cmds: (term.lastCmds || []).slice(), piped: !!term.lastPiped };
  const passed = !result.error && typeof step.check === "function" && step.check(ctx);

  if (passed) {
    state.earned += 15;
    state.feedback = { term: true };
    renderPractice();
    setTimeout(() => {
      state.feedback = null;
      state.stepIndex++;
      state.wrongTries = 0;
      if (state.stepIndex >= state.steps.length) finishLesson();
      else renderPractice();
    }, 700);
  } else {
    state.wrongTries++;
    state.feedback = null;
    renderPractice();
    const msg = document.getElementById("termMsg");
    if (msg) {
      msg.textContent = result.error ? "⚠️ La terminal dio un error. Revisa el comando." : "❌ Aún no. Prueba otra vez con el comando correcto.";
      msg.className = "mt-2 text-sm font-bold h-5 " + (result.error ? "text-duo-red" : "text-duo-red");
    }
  }
}

function finishLesson() {
  const p = state.progress;
  if (!p.completed.includes(state.lesson.id)) p.completed.push(state.lesson.id);
  p.xp += state.earned;
  touchStreak();
  saveProgress();
  renderResult(true);
}

function resetAll() {
  if (confirm("¿Borrar XP, rachas y lecciones completadas?")) {
    state.progress = defaultProgress();
    saveProgress();
    renderHome();
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (state.screen === "theory" || state.screen === "home") ) {
    if (state.screen === "theory") nextCard();
  }
});

renderHome();
</script>
